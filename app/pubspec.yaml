name: bandstand
description: "A personal practice app for a play-along library: MEGA folder sync, channel-isolating player, book reader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_rust_bridge: 2.13.0
  http: ^1.2.2
  path_provider: ^2.1.6
  # AES-128 for the MEGA client (ADR 0013): key unwrap, attribute decrypt,
  # CTR streaming, chunked MACs. `crypto` cannot do AES.
  pointycastle: ^3.9.1
  # Book PDF rendering for the reader (ADR 0012): pdfium-backed, raster off
  # the UI thread, and nothing to do with the audio path.
  pdfrx: ^2.6.5
  # MusicXML import (ADR 0011). Pure Dart.
  xml: ^6.5.0
  rust_lib_bandstand:
    path: rust_builder
  wakelock_plus: ^1.8.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used only by the domain purity test, to resolve a relative import and see
  # where it actually lands.
  path: ^1.9.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/chord_types.json
    - assets/scales.json
