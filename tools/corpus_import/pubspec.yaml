name: corpus_import
description: >-
  The corpus workbench (§6.4, ADR 0008). `corpus_import` turns a recorded bass
  take plus a chord annotation into the corpus JSON the app reads, slicing at
  bar boundaries and checking every phrase against the constraints of
  docs/rules/corpus-tiling.md §5. `audition` plays the corpus back through the
  real generator and writes a MIDI file, which is how the §10 M6 listening test
  is actually taken.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  # The real domain model, so the importer cannot emit something the app
  # cannot read. It imports only Flutter-free libraries — the domain purity
  # test is what makes that safe to rely on.
  bandstand:
    path: ../../app

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
