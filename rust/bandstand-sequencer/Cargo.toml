[package]
name = "bandstand-sequencer"
description = "Event scheduling, loops, count-in and the metronome for Bandstand."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bandstand-transport = { workspace = true }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
