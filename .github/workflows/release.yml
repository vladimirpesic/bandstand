name: Release

# Builds Bandstand for every supported platform and cuts a draft release.
# Triggered by pushing a v* tag:  git tag v1.0.0 && git push origin v1.0.0
# The release lands as a DRAFT: review the assets, then publish. Publishing
# is what makes releases/latest/download/... resolve, which the app uses as
# its primary soundbank mirror -- an unpublished draft means that URL is a
# 404 and the app falls back to the LFS mirror. Asset names are deliberately
# version-free so the website's releases/latest/download/<name> links
# survive version rolls.
# Signing, honestly: Windows and macOS binaries are unsigned, so first run
# needs the usual one-off bypass (SmartScreen / Gatekeeper); add signing
# secrets to the jobs below when they exist. The Android APK is signed with
# the development keystore (Flutter's template default), so swap in a
# release keystore before any Play listing. iOS is compiled unsigned as
# proof the tree builds and is NOT attached to the release because an
# unsigned .ipa cannot be installed; real iOS distribution goes through
# TestFlight with an Apple Developer account.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: flutter build linux --release
        working-directory: app
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/Bandstand-Linux-x64.tar.gz -C app/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: Bandstand-Linux-x64
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: flutter build windows --release
        working-directory: app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath dist\Bandstand-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bandstand-Windows-x64
          path: dist/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: flutter build macos --release
        working-directory: app
      - name: Package
        run: |
          mkdir -p dist
          APP=$(ls -d "$PWD"/app/build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$APP" dist/Bandstand-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bandstand-macOS
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: flutter build apk --release
        working-directory: app
      - name: Package
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/Bandstand-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bandstand-Android
          path: dist/

  # Proof the iOS tree compiles; unsigned, artifact-only, never released.
  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign
        working-directory: app
      - name: Package
        run: |
          mkdir -p dist
          cd app/build/ios/iphoneos
          APP=$(ls -d "$PWD"/*.app | head -1)
          mkdir Payload && cp -R "$APP" Payload/
          zip -rq "$GITHUB_WORKSPACE/dist/Bandstand-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Bandstand-iOS-unsigned
          retention-days: 7
          path: dist/

  release:
    needs:
      - linux
      - windows
      - macos
      - android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
            soundfonts/FluidR3_GM.sf2
